name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches Info.plist version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PLIST_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Info.plist)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "tag=$TAG_VERSION plist=$PLIST_VERSION"
          if [ "$PLIST_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Info.plist version ($PLIST_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Build, test and package
        run: ./release.sh

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: PPT Clicker ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/PPT-Clicker-*.zip
            dist/PPT-Clicker-*.dmg
            dist/SHA256SUMS.txt
          body: |
            ### Install

            Both methods below download with `curl`, so macOS **never** shows the
            "unverified developer" prompt:

            ```bash
            # Homebrew
            brew tap tncki/ppt-clicker https://github.com/tncki/ppt-clicker
            brew install --cask ppt-clicker

            # or one-line installer
            curl -fsSL https://raw.githubusercontent.com/tncki/ppt-clicker/main/install.sh | bash
            ```

            Downloading the `.zip`/`.dmg` by hand also works — then clear the
            quarantine flag once:

            ```bash
            xattr -dr com.apple.quarantine "/Applications/PPTClicker.app"
            ```

            ### Then

            1. Grant **Accessibility** (required). Grant **Input Monitoring** only if
               you want `ESC` to turn the clicker off.
            2. **Double-click the mouse wheel button** during a slideshow to toggle.
               The corner dot turns green while remapping is active.
            3. Left click / wheel down = next slide, right click / wheel up = previous.

            Universal binary (Apple Silicon + Intel), macOS 13+, MIT licensed.
            See [README](README.md) / [中文说明](README.zh-CN.md).
